# From Artifactory 7.111, HPA on the single-node artifactory chart requires
# minReplicas >= 2 (High Availability mode). The artifactory-ha chart has no
# such restriction.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  metrics: |
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70