# Artifactory on a non-EKS Kubernetes cluster, backed by an S3-compatible
# object store, authenticating with short-lived credentials that are
# live-swapped via an AWS "credential_process" (see README for background
# and the referenced blog post on aws-credential-process).

# Because there's no EKS/IRSA or EC2 instance profile available to hand
# Artifactory credentials automatically, this example points the AWS SDK's
# default credential chain at a profile whose credential_process calls out
# to a secure internal endpoint for a fresh, short-lived token.
#
# A separate, currently-known issue in AWS SDK v2 causes it to bypass the
# JVM keystore/truststore for TLS verification and fall back to the pod's
# OS-level trust store instead. So the custom CA needs to be trusted in
# *both* places:
#   1. artifactory.customCertificates (JVM truststore, via the chart)
#   2. a custom init container running `update-ca-trust` (OS truststore)

artifactory:
  persistence:
    type: s3-storage-v3-direct
    awsS3V3:
      # Replace with your S3-compatible endpoint (e.g. a MinIO, Ceph RGW, or
      # NetApp StorageGRID hostname).
      endpoint: s3.example-storage.internal
      bucketName: bucketName
      path: artifactory/filestore
      region: us-east-1
      useInstanceCredentials: true
      awsSdkV2: true

  # JVM truststore: adds the custom CA so Artifactory's own Java
  # processes trust the S3-compatible endpoint and the secure token
  # endpoint.
  customCertificates:
    enabled: true
    certificateSecretName: s3-secret

  # OS truststore workaround for the AWS SDK v2 issue: run
  # `update-ca-trust` inside the pod so the same custom CA is trusted
  # outside the JVM too (this is what the AWS SDK and the credential_process
  # script's `curl` call actually rely on).
  #
  # This reuses the "ca-certs" volume the chart already creates from
  # artifactory.customCertificates.certificateSecretName above — no need to
  # declare it again here.
  customInitContainers: |
    - name: update-ca-trust
      image: {{ include "artifactory.getImageInfoByValue" (list . "artifactory") }}
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        privileged: true
        readOnlyRootFilesystem: false
        allowPrivilegeEscalation: true
      command:
        - "bash"
        - "-c"
        - |
          mkdir -p /etc/pki/ca-trust/extracted/{edk2,java,openssl,pem}
          cp -f /tmp/s3-ca-certs/*.crt /etc/pki/ca-trust/source/anchors/ 2>/dev/null || true
          update-ca-trust extract
      volumeMounts:
        - name: ca-certs
          mountPath: /tmp/s3-ca-certs
          readOnly: true
        - name: ca-trust-extracted
          mountPath: /etc/pki/ca-trust/extracted

  # emptyDir that carries the freshly-extracted OS trust bundle from the
  # init container above into the main Artifactory container(s), plus the
  # Secret holding the AWS config + credential_process script.
  customVolumes: |
    - name: ca-trust-extracted
      emptyDir: {}
    - name: aws-credential-process
      secret:
        secretName: s3-credential-process
        defaultMode: 0755

  customVolumeMounts: |
    - name: ca-trust-extracted
      mountPath: /etc/pki/ca-trust/extracted
    - name: aws-credential-process
      mountPath: /opt/jfrog/artifactory/var/aws/config
      subPath: config
    - name: aws-credential-process
      mountPath: /opt/jfrog/artifactory/var/aws/get-s3-credentials.sh
      subPath: get-s3-credentials.sh

  # Point the AWS SDK at the mounted config file, and tell the
  # credential_process script which secure endpoint to call for a token.
  extraEnvironmentVariables:
    - name: AWS_CONFIG_FILE
      value: /opt/jfrog/artifactory/var/aws/config
    - name: SECURE_TOKEN_ENDPOINT_URL
      value: "https://secure-token-endpoint.example.internal/aws-credentials"
