jfrogUrl: "http://artifactory-local.my-arti.svc.cluster.local:8082"

database:
  type: "postgresql"
  driver: "pgx"
  url: "jdbc:postgresql://my-external-postgres:5432/catalog"
  secrets:
    user:
      name: "catalog-database-creds"
      key: "db-user"
    password:
      name: "catalog-database-creds"
      key: "db-password"