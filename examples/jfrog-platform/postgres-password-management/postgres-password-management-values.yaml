global:
  jfrogUrl: "https://my-platform.example.com"
  database:
    adminPassword: "<strong-superuser-password>"

postgresql:
  auth:
    postgresPassword: "<strong-superuser-password>"

artifactory:
  # nginx.https.enabled: false only satisfies the chart's fresh-install TLS gate (skips HTTPS entirely)
  # for this example; use a real tlsSecretName in production (see
  # ../tls-end-to-end).
  nginx:
    https:
      enabled: false
  database:
    user: artifactory
    password: "<strong-artifactory-password>"

xray:
  enabled: true