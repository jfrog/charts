global:
  jfrogUrl: "https://my-platform.example.com"

artifactory:
  # nginx.https.enabled: false only satisfies the chart's fresh-install TLS gate (skips HTTPS entirely)
  # for this example; use a real tlsSecretName in production.
  nginx:
    https:
      enabled: false
  artifactory:
    resources:
      requests:
        memory: "4Gi"
        cpu: "2"
      limits:
        memory: "8Gi"
        cpu: "4"
    javaOpts:
      xms: "2g"
      xmx: "6g"
