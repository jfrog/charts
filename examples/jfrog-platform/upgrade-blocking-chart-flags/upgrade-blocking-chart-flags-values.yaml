global:
  jfrogUrl: "https://my-platform.example.com"

artifactory:
  # splitServicesToContainers: true is already the default — omit the key
  # entirely rather than setting it explicitly. Setting it to false aborts
  # the install from chart releases in the 7.161.x line onward.

  # waitForDatabase defaults to false under jfrog-platform (the platform
  # chart manages startup ordering itself). Only set it true if you've
  # disabled that built-in ordering.
  waitForDatabase: false
