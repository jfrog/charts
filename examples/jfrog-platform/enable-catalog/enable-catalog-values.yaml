global:
  jfrogUrl: "https://my-platform.example.com"

artifactory:
  # nginx.https.enabled: false only satisfies the chart's fresh-install TLS gate (skips HTTPS entirely)
  # for this example; use a real tlsSecretName in production (see
  # ../tls-end-to-end).
  nginx:
    https:
      enabled: false

# xray.enabled is already the chart default; shown here because Catalog
# has a hard dependency on it (see "How it works").
xray:
  enabled: true

catalog:
  enabled: true