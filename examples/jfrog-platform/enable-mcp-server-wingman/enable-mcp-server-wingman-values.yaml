global:
  jfrogUrl: "https://my-platform.example.com"

artifactory:
  # nginx.https.enabled: false only satisfies the chart's fresh-install TLS gate (skips HTTPS entirely)
  # for this example; use a real tlsSecretName in production (see
  # ../tls-end-to-end).
  nginx:
    https:
      enabled: false

# The value must be the YAML boolean `true` (not the string "true") or the
# chart's beta-agreement check fails at template time.
wingman:
  enabled: true
  consentToJfrogOnlineBetaAgreement: true