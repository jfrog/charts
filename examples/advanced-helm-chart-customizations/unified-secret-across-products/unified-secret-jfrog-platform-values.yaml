global:
  jfrogUrl: "https://my-platform.example.com"
  joinKey: EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
  masterKey: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb

# jfrog-platform's own values.yaml already sets these to true by default
# for each subchart that supports them — shown explicitly here as the
# double-nested override form, e.g. to switch one product back to
# per-secret installation without touching the others.
artifactory:
  nginx:
    generateSelfSignedCert: true
  artifactory:
    unifiedSecretInstallation: true
    unifiedSecretPrependReleaseName: true

xray:
  xray:
    unifiedSecretInstallation: true