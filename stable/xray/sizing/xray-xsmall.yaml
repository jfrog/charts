##############################################################
# The xsmall sizing
# This is the minimum size recommended for running JFrog Xray
##############################################################

replicaCount: 1
databaseUpgradeReady: true
waitForDatabase: true
unifiedUpgradeAllowed: true

xray:
  podAntiAffinity:
    ## Valid values are "soft" or "hard"; any other value indicates no anti-affinity
    type: "hard"
    topologyKey: "kubernetes.io/hostname"

analysis:
  resources:
    requests:
      cpu: "30m"
      memory: 250Mi
    limits:
      # cpu: "3"
      memory: 4Gi

indexer:
  resources:
    requests:
      cpu: "36m"
      memory: 800Mi
    limits:
      # cpu: "4"
      memory: 4Gi

persist:
  resources:
    requests:
      cpu: "30m"
      memory: 250Mi
    limits:
      # cpu: "3"
      memory: 4Gi

server:
  resources:
    requests:
      cpu: "60m"
      memory: 250Mi
    limits:
      # cpu: "3"
      memory: 4Gi

router:
  resources:
    requests:
      cpu: "24m"
      memory: 50Mi
    limits:
      # cpu: "3"
      memory: 1Gi

observability:
  resources:
    requests:
      cpu: "5m"
      memory: 25Mi
    limits:
      # cpu: "850m"
      memory: 250Mi

sbom:
  resources:
    requests:
      cpu: "30m"
      memory: 250Mi
    limits:
      # cpu: "3"
      memory: 4Gi

policyenforcer:
  resources:
    requests:
      memory: "250Mi"
      cpu: "30m"
    limits:
      memory: "4Gi"
      # cpu: "3"

# PostgreSQL
## Configuration values for the postgresql dependency
## ref: https://github.com/kubernetes/charts/blob/master/stable/postgresql/README.md
##
postgresql:

  primary:
    resources:
      requests:
        memory: 16Gi
        cpu: "6"
      limits:
        memory: 16Gi
        # cpu: "18"
    extendedConfiguration: |
      max_connections = 500
      listen_addresses = '*'
      max_wal_size = '4GB'
    affinity:
      # Require PostgreSQL pod to run on a different node than Xray pods
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - xray
            topologyKey: kubernetes.io/hostname

rabbitmq:
  extraConfiguration: |-
    vm_memory_high_watermark.absolute = 2G
    {{- if not .Values.global.xray.rabbitmq.haQuorum.enabled }}
    raft.wal_max_size_bytes = 1048576
    {{- end }}
  resources:
    requests:
      cpu: "200m"
      memory: 300Mi
    limits:
      # cpu: "2"
      memory: 3Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - xray
          topologyKey: kubernetes.io/hostname

catalog:
  resources:
    requests:
      cpu: "1"
      memory: 3Gi
    limits:
      cpu: "2"
      memory: 6Gi

valkey:
  primary:
    resources:
      requests:
        cpu: "500m"
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
  replica:
    resources:
      requests:
        cpu: "500m"
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
  sentinel:
    resources:
      requests:
        cpu: "250m"
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi