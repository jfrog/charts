# PostgreSQL
## Configuration values for the postgresql dependency
## ref: https://github.com/kubernetes/charts/blob/master/stable/postgresql/README.md
##
postgresql:

  primary:
    resources:
      requests:
        memory: 64Gi
        cpu: "16"
      limits:
        memory: 64Gi
        # cpu: "32"
    extendedConfiguration: |
      max_connections = 1200
      listen_addresses = '*'
      max_wal_size = '4GB'
    affinity:
      # Require PostgreSQL pod to run on a different node than Xray pods
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - xray
            topologyKey: kubernetes.io/hostname

rabbitmq:
  extraConfiguration: |-
    vm_memory_high_watermark.absolute = 4G
    {{- if not .Values.global.xray.rabbitmq.haQuorum.enabled }}
    raft.wal_max_size_bytes = 1048576
    {{- end }}
  resources:
    requests:
      cpu: "200m"
      memory: 500Mi
    limits:
      # cpu: "4"
      memory: 5Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - xray
          topologyKey: kubernetes.io/hostname

catalog:
  resources:
    requests:
      cpu: "5"
      memory: 12Gi
    limits:
      # cpu: "10"
      memory: 24Gi
  initContainers:
    resources:
      requests:
        memory: "50Mi"
        cpu: "12m"
      limits:
        memory: "1Gi"
        cpu: "250m"
  router:
    resources:
      requests:
        cpu: "60m"
        memory: 100Mi
      limits:
        # cpu: "3"
        memory: 1Gi

valkey:
  primary:
    resources:
      requests:
        cpu: "2"
        memory: 6Gi
      limits:
        # cpu: "4"
        memory: 12Gi
    ## Bound the cache below limits.memory so Valkey evicts instead of being
    ## OOMKilled. The headroom covers fork() copy-on-write during AOF rewrite,
    ## replication buffers and allocator fragmentation.
    ## Applied when sentinel.enabled=false; keep in sync with limits.memory.
    configuration: |-
      maxmemory 9gb
      maxmemory-policy allkeys-lru
  replica:
    resources:
      requests:
        cpu: "2"
        memory: 6Gi
      limits:
        # cpu: "4"
        memory: 12Gi
    ## With sentinel.enabled=true (the default) every node runs from this
    ## block, so this is the setting that actually takes effect.
    configuration: |-
      maxmemory 9gb
      maxmemory-policy allkeys-lru
  sentinel:
    resources:
      requests:
        cpu: "250m"
        memory: 256Mi
      limits:
        # cpu: "1"
        memory: 1Gi
  kubectl:
    resources:
      requests:
        memory: "50Mi"
        cpu: "12m"
      limits:
        memory: "250Mi"
        cpu: "250m"