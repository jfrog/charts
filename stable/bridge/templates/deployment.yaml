apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "bridge.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- with .Values.labels }}
{{ toYaml . | indent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
{{- if .Values.securityContext }}
    {{- fail ".Values.securityContext is no longer supported and should be replaced with .Values.containerSecurityContext" }}
{{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "common.labels.matchLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/bridge-systemyaml: {{ include (print $.Template.BasePath "/system-yaml.yaml") . | sha256sum }}
        checksum/bridge-secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- if .Values.commonAnnotations }}
        {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 8 }}
        {{- end }}
        {{- if .Values.podAnnotations }}
        {{ include "common.tplvalues.render" (dict "value" .Values.podAnnotations "context" $) | nindent 8 }}
        {{- end }}
        {{- if not (or .Values.systemYamlOverride.existingSecret .Values.global.systemYamlOverride.existingSecret) }}
        checksum/systemyaml: {{ include (print $.Template.BasePath "/system-yaml.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.common.configMaps }}
        checksum/configmaps: {{ include (print $.Template.BasePath "/bridge-configmaps.yaml") . | sha256sum }}
        {{- end }}
      labels: {{- include "common.labels.standard" . | nindent 8 }}
        {{- if .Values.podLabels }}
        {{- include "common.tplvalues.render" (dict "value" .Values.podLabels "context" $) | nindent 8 }}
        {{- end }}
    spec:
      {{- include "bridge.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "bridge.serviceAccountName" . }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext: {{- omit .Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.common.topologySpreadConstraints }}
      topologySpreadConstraints:
{{ tpl (toYaml .Values.common.topologySpreadConstraints) . | indent 8 }}
      {{- end }}
      initContainers:
        - name: 'copy-system-yaml'
          image: {{ template "initContainers.image" . }}
          imagePullPolicy: {{ .Values.initContainers.image.pullPolicy | quote }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.initContainers.resources }}
          resources: {{- toYaml .Values.initContainers.resources | nindent 12 }}
          {{- end }}
          command:
            - '/bin/bash'
            - '-c'
            - >
              echo "Copy system.yaml to /var/opt/jfrog/bridge/etc";
              mkdir -p /var/opt/jfrog/bridge/etc;
            {{- if .Values.systemYamlOverride.existingSecret }}
              cp -fv /tmp/etc/{{ .Values.systemYamlOverride.dataKey }} /var/opt/jfrog/bridge/etc/system.yaml;
            {{- else if (tpl .Values.global.systemYamlOverride.existingSecret .) }}
              cp -fv /tmp/etc/{{ .Values.global.systemYamlOverride.dataKey }} /var/opt/jfrog/bridge/etc/system.yaml;
            {{- else }}
              cp -fv /tmp/etc/system.yaml /var/opt/jfrog/bridge/etc/system.yaml;
            {{- end }}
              echo "Remove /var/opt/jfrog/bridge/lost+found folder if exists";
              rm -rfv /var/opt/jfrog/bridge/lost+found;
              mkdir -p /var/opt/jfrog/bridge/data/bridge/usage;
          volumeMounts:
            - name: data
              mountPath: "/var/opt/jfrog/bridge"
            - name: systemyaml
              {{- if .Values.systemYamlOverride.existingSecret }}
              mountPath: "/tmp/etc/{{ .Values.systemYamlOverride.dataKey }}"
              subPath: {{ .Values.systemYamlOverride.dataKey }}
              {{- else if (tpl .Values.global.systemYamlOverride.existingSecret .) }}
              mountPath: "/tmp/etc/{{ .Values.global.systemYamlOverride.dataKey }}"
              subPath: {{ .Values.global.systemYamlOverride.dataKey }}
              {{- else }}
              mountPath: "/tmp/etc/system.yaml"
              subPath: system.yaml
              {{- end }}
      {{- if or .Values.customCertificates.enabled .Values.global.customCertificates.enabled .Values.tunnelClientCertificateSecretName }}
        - name: copy-custom-certificates
          image: {{ template "initContainers.image" . }}
          imagePullPolicy: {{ .Values.initContainers.image.pullPolicy | quote }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.initContainers.resources }}
          resources: {{- toYaml .Values.initContainers.resources | nindent 12 }}
          {{- end }}
          command:
            - 'bash'
            - '-c'
            - >
{{ include "bridge.copyCustomCerts" . | indent 14 }}
          volumeMounts:
            - name: data
              mountPath: "/var/opt/jfrog/bridge"
            {{- if or .Values.customCertificates.enabled .Values.global.customCertificates.enabled }}
            - name: ca-certs
              mountPath: "/tmp/certs"
            {{- end }}
            {{- if .Values.tunnelClientCertificateSecretName }}
            - name: client-cert
              mountPath: "/tmp/client-cert"
            {{- end }}
      {{- end }}
    {{- if or .Values.common.customInitContainers .Values.global.customInitContainers }}
{{ tpl (include "bridge.customInitContainers" .)  . | indent 8 }}
    {{- end }}
      {{- if .Values.hostAliases }}
      hostAliases:
{{ toYaml .Values.hostAliases | indent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          image: {{ template "bridge.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - {{ .Values.mode }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if .Values.customReadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customReadinessProbe "context" $) | nindent 12 }}
          {{- else if .Values.readinessProbe.enabled }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.readinessProbe "enabled") "context" $) | nindent 12 }}
            initialDelaySeconds: {{ if semverCompare "<v1.20.0-0" $.Capabilities.KubeVersion.Version }}90{{ else }}0{{ end }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            httpGet:
              path: /api/v1/system/readiness
              port: {{ .Values.service.port }}
          {{- end }}
          {{- if .Values.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customLivenessProbe "context" $) | nindent 12 }}
          {{- else if .Values.livenessProbe.enabled }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.livenessProbe "enabled") "context" $) | nindent 12 }}
            initialDelaySeconds: {{ if semverCompare "<v1.20.0-0" $.Capabilities.KubeVersion.Version }}90{{ else }}0{{ end }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            httpGet:
              path: /api/v1/system/liveness
              port: {{ .Values.service.port }}
          {{- end }}
          {{- if .Values.customStartupProbe }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customStartupProbe "context" $) | nindent 12 }}
          {{- else if .Values.startupProbe.enabled }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.startupProbe "enabled") "context" $) | nindent 12 }}
            initialDelaySeconds: {{ if semverCompare "<v1.20.0-0" $.Capabilities.KubeVersion.Version }}90{{ else }}0{{ end }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            httpGet:
              path: /api/v1/system/readiness
              port: {{ .Values.service.port }}
          {{- end }}
          resources:
            {{- include "common.resources" (dict "resources" .Values.resources) | nindent 12 }}
          env:
            - name: JF_BRIDGE_LISTENADDR
              value: {{ .Values.listenAddr }}
            - name: JF_SHARED_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if not (or .Values.systemYamlOverride.existingSecret .Values.global.systemYamlOverride.existingSecret) }}
            - name: JF_SHARED_SECURITY_JOINKEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bridge.joinKeySecretName" . }}
                  key: join-key
                  optional: true
            - name: JF_SHARED_SECURITY_MASTERKEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bridge.masterKeySecretName" . }}
                  key: master-key
                  optional: true
            ## Only providing the token for the "default" bridge to avoid complexity in the chart.
            ## Values for other bridges should be provided in .Values.extraEnvironmentVariables in the form of:
            ## JF_BRIDGE_TUNNEL_CLIENT_BRIDGES_<BRIDGE NAME>_REMOTE_TOKEN
            - name: JF_BRIDGE_TUNNEL_CLIENT_BRIDGES_DEFAULT_REMOTE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bridge.tunnelClientTokenSecretName" . }}
                  key: tunnel-client-token
                  optional: true
            {{- end }}
            - name: JF_PRODUCT_HOME
              value: {{ .Values.service.productHome | quote }}
{{- with .Values.extraEnvironmentVariables }}
{{ tpl (toYaml .) $ | indent 12 }}
{{- end }}
          volumeMounts:
            - name: data
              mountPath: "/var/opt/jfrog/bridge"
          {{- if .Values.common.extraVolumeMounts }}
          {{- toYaml .Values.common.extraVolumeMounts | nindent 12 }}
          {{- end }}
          {{- if .Values.lifecycle.preStopSleepSeconds }}
# this sleep is here in order to keep our service responding while k8s is removing it from network
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ .Values.lifecycle.preStopSleepSeconds }}"]
          {{- end }}
        - name: {{ .Values.router.name }}
          image: {{ template "router.image" . }}
          imagePullPolicy: {{ .Values.router.image.imagePullPolicy }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.router.persistence.mountPath | quote }}
          {{- if .Values.common.extraVolumeMounts }}
          {{- toYaml .Values.common.extraVolumeMounts | nindent 12 }}
          {{- end }}
          {{- if .Values.router.extraVolumeMounts }}
          {{- toYaml .Values.router.extraVolumeMounts | nindent 12 }}
          {{- end }}
          env:
            - name: JF_ROUTER_TOPOLOGY_LOCAL_REQUIREDSERVICETYPES
              value: {{ include "bridge.router.requiredServiceTypes" . }}
            - name: JF_SHARED_JFROGURL
              value: "{{ tpl (required "\n\njfrogUrl or global.jfrogUrl is required! This allows to connect to Artifactory.\nYou can copy the JFrog URL from Administration > User Management > Settings > Connection details" (include "bridge.jfrogUrl" .)) . }}"
            - name: JF_SHARED_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if not (or .Values.systemYamlOverride.existingSecret .Values.global.systemYamlOverride.existingSecret) }}
            - name: JF_SHARED_SECURITY_JOINKEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bridge.joinKeySecretName" . }}
                  key: join-key
                  optional: true
            - name: JF_SHARED_SECURITY_MASTERKEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bridge.masterKeySecretName" . }}
                  key: master-key
                  optional: true
            {{- end }}

{{- with .Values.router.extraEnvironmentVariables }}
{{ tpl (toYaml .) $ | indent 12 }}
{{- end }}
          ports:
            - name: http-router-in
              containerPort: {{ .Values.router.internalPort }}
            - name: http-router
              containerPort: {{ .Values.router.externalPort }}
          resources:
            {{- include "common.resources" (dict "resources" .Values.router.resources) | nindent 12 }}
          {{- if .Values.router.customStartupProbe }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" .Values.router.customStartupProbe "context" $) | nindent 12 }}
          {{- else if .Values.router.startupProbe.enabled }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.router.startupProbe "enabled") "context" $) | nindent 12 }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            exec:
              command:
                - sh
                - -c
                - curl -s -k --fail --max-time {{ .Values.probes.timeoutSeconds }} http://localhost:{{ .Values.router.internalPort }}/router/api/v1/system/readiness
          {{- end }}
          {{- if .Values.router.customReadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.router.customReadinessProbe "context" $) | nindent 12 }}
          {{- else if .Values.router.readinessProbe.enabled }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.router.readinessProbe "enabled") "context" $) | nindent 12 }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            initialDelaySeconds: {{ if semverCompare "<v1.20.0-0" .Capabilities.KubeVersion.Version }}60{{ else }}0{{ end }}
            exec:
              command:
                - sh
                - -c
                - curl -s -k --fail --max-time {{ .Values.probes.timeoutSeconds }} http://localhost:{{ .Values.router.internalPort }}/router/api/v1/system/readiness
          {{- end }}
          {{- if .Values.router.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.router.customLivenessProbe "context" $) | nindent 12 }}
          {{- else if .Values.router.livenessProbe.enabled }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.router.livenessProbe "enabled") "context" $) | nindent 12 }}
            exec:
              command:
                - sh
                - -c
                - curl -s -k --fail --max-time {{ .Values.probes.timeoutSeconds }} http://localhost:{{ .Values.router.internalPort }}/router/api/v1/system/liveness
            initialDelaySeconds: {{ if semverCompare "<v1.20.0-0" .Capabilities.KubeVersion.Version }}90{{ else }}0{{ end }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
          {{- end }}
          {{- if .Values.lifecycle.preStopSleepSeconds }}
# this sleep is here in order to keep our service responding while k8s is removing it from network
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ .Values.lifecycle.preStopSleepSeconds }}"]
          {{- end }}
      {{- if .Values.observability.enabled }}
        - name: {{ .Values.observability.name }}
          image: {{ template "observability.image" . }}
          imagePullPolicy: {{ .Values.observability.image.pullPolicy }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          command:
            - '/bin/sh'
            - '-c'
            - >
          {{- with .Values.common.preStartCommand }}
              echo "Running custom common preStartCommand command";
              {{ tpl . $ }};
          {{- end }}
              exec /opt/jfrog/observability/app/bin/entrypoint-observability.sh;
          {{- with .Values.observability.lifecycle }}
          lifecycle:
{{ toYaml . | indent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: "{{ .Values.observability.persistence.mountPath }}"
          resources:
            {{- include "common.resources" (dict "resources" .Values.observability.resources) | nindent 12 }}
          {{- if .Values.observability.customStartupProbe }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" .Values.observability.customStartupProbe "context" $) | nindent 12 }}
          {{- else if .Values.observability.startupProbe.enabled }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.observability.startupProbe "enabled") "context" $) | nindent 12 }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            exec:
              command:
                - sh
                - -c
                - curl --fail --max-time {{ .Values.probes.timeoutSeconds }} http://localhost:{{ .Values.observability.internalPort }}/api/v1/system/readiness
          {{- end }}
          {{- if .Values.observability.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.observability.customLivenessProbe "context" $) | nindent 12 }}
          {{- else if .Values.observability.livenessProbe.enabled }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.observability.livenessProbe "enabled") "context" $) | nindent 12 }}
            initialDelaySeconds: {{ if semverCompare "<v1.20.0-0" .Capabilities.KubeVersion.Version }}90{{ else }}0{{ end }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            exec:
              command:
                - sh
                - -c
                - curl --fail --max-time {{ .Values.probes.timeoutSeconds }} http://localhost:{{ .Values.observability.internalPort }}/api/v1/system/liveness
          {{- end }}
          env:
            {{- if not (or .Values.systemYamlOverride.existingSecret .Values.global.systemYamlOverride.existingSecret) }}
            - name: JF_SHARED_SECURITY_JOINKEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bridge.joinKeySecretName" . }}
                  key: join-key
                  optional: true
            - name: JF_SHARED_SECURITY_MASTERKEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bridge.masterKeySecretName" . }}
                  key: master-key
                  optional: true
            {{- end }}
            - name: JF_SHARED_PLATFORMSERVICES_ENABLED
              value: "true"
      {{- end }}
      {{- range .Values.loggers }}
        - name: {{ . | replace "_" "-" | replace "." "-" }}
          image: {{ template "initContainers.image" $ }}
          imagePullPolicy: {{ $.Values.initContainers.image.pullPolicy | quote }}
          {{- if $.Values.containerSecurityContext.enabled }}
          securityContext: {{- omit $.Values.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          resources:
            {{- include "common.resources" (dict "resources" $.Values.loggersResources) | nindent 12 }}
          command:
            - 'sh'
            - '-c'
            - 'sh /scripts/tail-log.sh /var/opt/jfrog/bridge/log {{ . }}'
          volumeMounts:
            - name: data
              mountPath: "/var/opt/jfrog/bridge"
            - name: tail-logger-script
              mountPath: /scripts/tail-log.sh
              subPath: tail-log.sh
      {{- end }}
      {{- if .Values.filebeat.enabled }}
        - name: {{ .Values.filebeat.name }}
          image: {{ template "filebeat.image" . }}
          imagePullPolicy: {{ .Values.filebeat.image.pullPolicy }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          args:
            - "-e"
            - "-E"
            - "http.enabled=true"
          volumeMounts:
            - name: filebeat-config
              mountPath: /usr/share/filebeat/filebeat.yml
              readOnly: true
              subPath: filebeat.yml
            - name: data
              mountPath: "/var/opt/jfrog/bridge"
          livenessProbe:
{{ toYaml .Values.filebeat.livenessProbe | indent 12 }}
          readinessProbe:
{{ toYaml .Values.filebeat.readinessProbe | indent 12 }}
          resources:
            {{- include "common.resources" (dict "resources" .Values.filebeat.resources) | nindent 12 }}
      {{- end }}
    {{- if or .Values.common.customSidecarContainers .Values.global.customSidecarContainers }}
{{ tpl (include "bridge.customSidecarContainers" .) . | indent 8 }}
    {{- end }}
    {{- if or .Values.nodeSelector .Values.global.nodeSelector }}
{{ tpl (include "bridge.nodeSelector" .) . | indent 6 }}
    {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      {{- if or .Values.customCertificates.enabled .Values.global.customCertificates.enabled }}
        - name: ca-certs
          secret:
            secretName: {{ default .Values.global.customCertificates.certificateSecretName .Values.customCertificates.certificateSecretName }}
      {{- end }}
      {{- if .Values.tunnelClientCertificateSecretName }}
        - name: client-cert
          secret:
            secretName: {{ .Values.tunnelClientCertificateSecretName }}
      {{- end }}
        - name: data
          emptyDir: {}
        - name: systemyaml
          secret:
            secretName: {{ default ( default (printf "%s-%s" (include "bridge.fullname" .) "systemyaml") ( tpl .Values.global.systemYamlOverride.existingSecret .) ) .Values.systemYamlOverride.existingSecret }}
      {{- if .Values.loggers }}
        - name: tail-logger-script
          configMap:
            name: {{ template "bridge.fullname" . }}-logger
      {{- end }}
      {{- if .Values.filebeat.enabled }}
        - name: filebeat-config
          configMap:
            name: {{ template "bridge.fullname" . }}-filebeat-config
      {{- end }}
        {{- if .Values.common.extraVolumes }}
        {{- toYaml .Values.common.extraVolumes | nindent 8 }}
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- toYaml .Values.extraVolumes | nindent 8 }}
        {{- end }}
      {{- if .Values.common.configMaps }}
        - name: bridge-configmaps
          configMap:
            name: {{ template "bridge.fullname" . }}-configmaps
      {{- end }}