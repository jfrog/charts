{{- if not (or .Values.systemYamlOverride.existingSecret .Values.global.systemYamlOverride.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bridge.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- with .Values.labels }}
{{ toYaml . | indent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- if or .Values.masterKey .Values.global.masterKey }}
  {{- if not (or .Values.masterKeySecretName .Values.global.masterKeySecretName) }}
  master-key: {{ include "bridge.masterKey" . | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if or .Values.joinKey .Values.global.joinKey }}
  {{- if not (or .Values.joinKeySecretName .Values.global.joinKeySecretName) }}
  join-key: {{ include "bridge.joinKey" . | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.tunnelClientToken (not .Values.tunnelClientTokenSecretName) }}
  tunnel-client-token: {{ .Values.tunnelClientToken | b64enc | quote }}
  {{- end }}
{{- end }}
