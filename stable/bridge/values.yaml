# Default values for JFrog Bridge.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  ## Image registry to pull docker images from
  imageRegistry: ""
  ## Secrets used to pull images from private registries
  imagePullSecrets: []

  ## Chart.AppVersion can be overridden using global.versions.bridge or image tags
  ## Note: Order of preference is 1) global.versions 2) image tags 3) Chart.AppVersion
  versions: {}
    # bridge:
    # router:
    # initContainers:
    # observability:
    # filebeat:

  ## Image digests can be overridden using global.digests
  ## Note: Order of preference is 1) global.digests 2) image digests
  digests: {}
    # bridge:
    # router:
    # initContainers:
    # observability:
    # filebeat:

  ## Artifactory URL
  # jfrogUrl: ""
  ## JFrog Bridge service requires a unique master key.
  ## You can generate one with the command: "openssl rand -hex 32"
  ## An initial one is auto generated on first startup.
  # masterKey: ""

  ## Alternatively, you can use a pre-existing secret with a key
  ## called "master-key" by specifying "masterKeySecretName"
  # masterKeySecretName: ""

  ## Join Key to connect other services to Artifactory
  ## IMPORTANT: Setting this value overrides the existing joinKey
  # joinKey: ""

  ## Alternatively, you can use a pre-existing secret with a key
  ## called "join-key" by specifying "joinKeySecretName"
  # joinKeySecretName: ""

  systemYamlOverride:
    ## You can use a pre-existing secret by specifying existingSecret
    existingSecret: ""
    ## The dataKey should be the name of the secret data key created.
    dataKey:

## Note: tags customInitContainers,extraVolumes,extraVolumeMounts,customSidecarContainers can be used both from global and application level simultaneously
  # extraVolumes: []

# extraVolumeMounts: []

  # customInitContainers: |

  # customSidecarContainers: |

  ## certificates added to this secret will be copied to $JFROG_HOME/var/etc/security/keys/trusted directory
  customCertificates:
    enabled: false
    # certificateSecretName:

  ## Applies to Bridge pods
  nodeSelector: {}

## Artifactory URL. Mandatory
jfrogUrl:

## Number of replicas used when autoscaling is disabled
replicaCount: 1

## JFrog Bridge run mode. Possible values: client, server
mode: client

listenAddr: 0.0.0.0  # Required for using httpGet probes

## Configuration for the tunnel. Depending on the mode, the client or server configuration is used
tunnel:
  client:
    bridges: {}
      ## Configuration for the default bridge
      # default:
        ## Configuration for the local endpoint. Client will forward requests to this endpoint
        # local:
          # url:
        ## Configuration for the remote endpoint. Client will open a tunnel to this endpoint
        # remote:
          # url:
        ## Minimal number of tunnels to create and keep open (re-open them) in case of failure
        # minTunnels: 2
        ## Maximal number of tunnels to create and keep open (re-open them) in case of failure
        # maxTunnels: 10
        # jobs:
          # tunnelCreation:
            ## Interval in minutes used to create additional tunnels if needed
            # intervalMinutes: 1
          # tunnelClosing:
            ## If set to true, the client will close tunnels that are still in use
            # allowCloseUsedTunnels: true
        # targetUsage:
          ## If the number of active requests is higher than value, the client will create more tunnels.
          # low: 1
          ## If the number of active requests is lower than value, the client will close redundant tunnels.
          # high: 5
  server:
    forward:
      ## Timeout for dialing the endpoint using the tunnel
      dialTimeoutSecs: 5
    ## Amount of tunnels to keep open for incoming connections.
    ## If this limit is reached, the server doesn't open new tunnel and returns 429 status code.
    # maxTunnels: 100
    ## Amount of streams to keep open per tunnel.
    ## If this limit is reached, the server returns 429 status code.
    # maxStreamPerTunnel: 50


## Token used to authenticate the client with the remote endpoint in order to open a tunnel
## Token should have scope 'system:bridge:x' and be long-lived
## Token will be used for the "default" bridge
tunnelClientToken:
## Alternatively, you can use a pre-existing secret with a key called tunnel-client-token by specifying tunnelClientTokenSecretName
tunnelClientTokenSecretName: ""

## Name of the secret containing the certificate sent by the client to the remote endpoint during opening of the tunnel
## Server will use this certificate to validate requests before forwarding them
## Secret should contain 'tls_cert.crt' key with the certificate
tunnelClientCertificateSecretName: ""

## JFrog Bridge image
image:
  registry: releases-docker.jfrog.io
  repository: jfrog/bridge
  pullPolicy: IfNotPresent

## String to partially override bridge.name template (will maintain the release name)
nameOverride: ""
## String to fully override bridge.fullname template
fullnameOverride: ""

## Specify common probes parameters
probes:
  timeoutSeconds: 120

## Service Account
## Ref: https://kubernetes.io/docs/admin/service-accounts-admin/
##
serviceAccount:
  ## Specifies whether a service account should be created
  create: true
  ## Annotations to add to the service account
  annotations: {}
  ## The name of the service account to use.
  ## If not set and create is true, a name is generated using the fullname template
  name: ""

## Annotations added to JFrog Bridge pods
podAnnotations: {}

## Disable podSecurityContext for openshift
podSecurityContext:
  enabled: true
  fsGroup: 1065
  runAsUser: 1065

## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
## Disable containerSecurityContext for openshift
containerSecurityContext:
  enabled: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - NET_RAW

## Set sleep in order to keep service responding while k8s is removing it from network
lifecycle:
  preStopSleepSeconds: 15

## Bridge service configuration
service:
  type: ClusterIP
  port: 8069
  ## If the type is NodePort you can set a fixed port
  # nodePort: 30000
  productHome: /opt/jfrog/bridge

## Bridge service ingress configuration
ingress:
  enabled: false
  ingress_class: ""
  hostname: ""
  clientBodyTimeout: 43200s
  backendPortName: http-router

## Network Policy configuration
## ref: https://kubernetes.io/docs/concepts/services-networking/network-policies/
##
networkpolicy: []
  ## Allows all ingress and egress
  # - name: bridge
  #   podSelector:
  #     matchLabels:
  #       app.kubernetes.io/name: bridge
  #   egress:
  #   - {}
  #   ingress:
  #   - from:
  #     - namespaceSelector:
  #         matchLabels:
  #           networkpolicy: allowed
  #     - podSelector: {}


## Bridge container resources
## @param resources.disableCpuLimits Set to true to disable CPU limits (prevents CFS throttling for CPU-bound workloads)
## @param resources.requests CPU/memory requests for the container
## @param resources.limits CPU/memory limits for the container (cpu limit ignored if disableCpuLimits is true)
resources: {}
#  ## Set to true to disable CPU limits entirely (recommended for CPU-bound or bursty workloads)
#  ## When enabled, resources.limits.cpu will NOT be rendered in the pod spec
#  ## This helps avoid CFS throttling while still allowing CPU requests to be set
#  disableCpuLimits: false
#  limits:
#    cpu: 2
#    memory: 1536Mi
#  requests:
#    cpu: 2
#    memory: 1536Mi

## Autoscaling configuration for JFrog Bridge deployment
autoscaling:
  ## @param autoscaling.enabled Enable replica autoscaling settings
  ##
  enabled: false
  ## @param autoscaling.minReplicas Minimum replicas for the pod autoscaling
  ##
  minReplicas: 1
  ## @param autoscaling.maxReplicas Maximum replicas for the pod autoscaling
  ##
  maxReplicas: 11
  ## @param autoscaling.targetCPU Percentage of CPU to consider when autoscaling
  ##
  targetCPU: ""
  ## @param autoscaling.targetMemory Percentage of Memory to consider when autoscaling
  ##
  targetMemory: ""

## @param serviceMonitor Declaratively specifies how groups of Kubernetes services should be monitored.
## Ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/user-guides/getting-started.md
serviceMonitor:
  observabilityEnabled: false
  scheme: http
  targetPort: 8082
  enabled: false
  interval: 60s
  scrapeTimeout: 15s
  kubePromApp: ""
  kubePromFullName: ""
  namespaceSelector:
    any: true
  ## @param serviceMonitor.additionalLabels Extra labels merged into ServiceMonitor.metadata.labels
  ## Required for Prometheus serviceMonitorSelector matching (e.g. release: prometheus)
  additionalLabels: {}
  ## @param serviceMonitor.relabelings Prometheus relabel configs applied to every endpoint (bridge, router, observability)
  ## Ref: https://prometheus.io/docs/prometheus/latest/configuration/configuration/#relabel_config
  relabelings: []

## Applies to bridge pods
nodeSelector: {}

## Applies to bridge pods
tolerations: []

## Applies to bridge pods
affinity: {}

## Extra environment variables that can be used to tune JFrog Bridge service to your needs.
## Uncomment and set value as needed
extraEnvironmentVariables:
#  - name: MY_ENV_VAR
#    value: ""


router:
  name: router
  image:
    registry: releases-docker.jfrog.io
    repository: jfrog/router
    tag: 7.729.35
    # digest:
    imagePullPolicy: IfNotPresent
  serviceRegistry:
    ## Service registry (Access) TLS verification skipped if enabled
    insecure: false
    ## Service registry URL and gRPC URL use jfrogUrl by default. Override if needed
