## Filebeat Sidecar container
## The provided filebeat configuration is for JFrog Bridge logs. It assumes you have a logstash installed and configured properly.
filebeat:
  enabled: false
  name: bridge-filebeat
  image:
    registry: docker.elastic.co
    repository: beats/filebeat
    tag: 7.17.29
    # digest:
    pullPolicy: IfNotPresent
  logstashUrl: "logstash:5044"

  terminationGracePeriod: 10

  livenessProbe:
    exec:
      command:
        - sh
        - -c
        - |
          #!/usr/bin/env bash -e
          curl --fail 127.0.0.1:5066
    failureThreshold: 3
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5

  readinessProbe:
    exec:
      command:
        - sh
        - -c
        - |
          #!/usr/bin/env bash -e
          filebeat test output
    failureThreshold: 3
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5

  ## @param filebeat.resources.disableCpuLimits Set to true to disable CPU limits for filebeat
  resources: {}
    # disableCpuLimits: false
    # requests:
    #   memory: "100Mi"
    #   cpu: "100m"
    # limits:
    #   memory: "100Mi"
    #   cpu: "100m"

  filebeatYml: |
    logging.level: info
    path.data: /var/opt/jfrog/bridge/log/filebeat
    name: bridge-filebeat
    queue.spool:
      file:
        permissions: 0760
    filebeat.inputs:
    - type: log
      enabled: true
      close_eof: ${CLOSE:false}
      paths:
         - /var/opt/jfrog/bridge/log/*.log
      fields:
        service: "jfbrc"
        log_type: "bridge"
    output:
      logstash:
         hosts: ["{{ .Values.filebeat.logstashUrl }}"]

