{{/*
TLS certificate secret for nginx HTTPS.

By default this chart does NOT generate certificates. The Secret is rendered only when:
  - A pre-existing <fullname>-nginx-certificate Secret exists in the namespace
    (from an earlier release) — data is REUSED via lookup, NOT regenerated,
    so HTTPS keeps working seamlessly on upgrade. The Secret is annotated
    with helm.sh/resource-policy: keep so a future release can remove this
    template without cascade-deleting the Secret.
  - OR nginx.generateSelfSignedCert=true is set (opt-in, dev/test only) —
    a fresh self-signed certificate is generated at install time.

Skipped entirely when nginx.tlsSecretName is set (customer supplies their own).
*/}}
{{- if and .Values.nginx.enabled .Values.nginx.https.enabled (not .Values.nginx.tlsSecretName) }}
{{- $legacyName := printf "%s-nginx-certificate" (include "artifactory.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $legacyName -}}
{{- if or $existing .Values.nginx.generateSelfSignedCert }}
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ $legacyName }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app: {{ template "artifactory.name" . }}
    chart: {{ template "artifactory.chart" . }}
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
data:
{{- if $existing }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
{{- else }}
{{ ( include "artifactory.gen-certs" . ) | indent 2 }}
{{- end }}
{{- end }}
{{- end }}
