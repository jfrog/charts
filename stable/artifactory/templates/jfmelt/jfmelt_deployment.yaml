{{- if eq (include "artifactory.jfmelt.enabled" .) "true" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jfmelt.fullname" . }}
  labels:
    app: {{ template "artifactory.name" . }}
    chart: {{ template "artifactory.chart" . }}
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
    component: {{ .Values.jfmelt.name }}
{{- if .Values.jfmelt.deployment.labels }}
{{ toYaml .Values.jfmelt.deployment.labels | indent 4 }}
{{- end }}
{{- with .Values.jfmelt.deployment.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  replicas: {{ .Values.jfmelt.replicaCount }}
  strategy:
    type: "RollingUpdate"
  selector:
    matchLabels:
      app: {{ template "artifactory.name" . }}
      release: {{ .Release.Name }}
      component: {{ .Values.jfmelt.name }}
  template:
    metadata:
      annotations:
      {{- if not .Values.artifactory.unifiedSecretInstallation }}
        checksum/database-secrets: {{ include (print $.Template.BasePath "/artifactory-database-secrets.yaml") . | sha256sum }}
        checksum/systemyaml: {{ include (print $.Template.BasePath "/artifactory-system-yaml.yaml") . | sha256sum }}
      {{- else }}
        checksum/artifactory-unified-secret: {{ include (print $.Template.BasePath "/artifactory-unified-secret.yaml") . | sha256sum }}
      {{- end }}
      {{- with .Values.jfmelt.pod.annotations }}
{{ toYaml . | indent 8 }}
      {{- end }}
      labels:
        app: {{ template "artifactory.name" . }}
        chart: {{ template "artifactory.chart" . }}
        component: {{ .Values.jfmelt.name }}
        heritage: {{ .Release.Service }}
        release: {{ .Release.Name }}
      {{- with .Values.jfmelt.pod.labels }}
{{ toYaml . | indent 8 }}
      {{- end }}
    spec:
      {{- if or .Values.imagePullSecrets .Values.global.imagePullSecrets }}
  {{- include "artifactory.imagePullSecrets" . | indent 6 }}
      {{- end }}
      {{- if .Values.jfmelt.podSecurityContext.enabled }}
      securityContext: {{- omit .Values.jfmelt.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.jfmelt.serviceAccountName }}
      serviceAccountName: {{ .Values.jfmelt.serviceAccountName }}
      {{- end}}
      initContainers:
        {{- if .Values.jfmelt.customInitContainers }}
{{ tpl (include "artifactory.jfmelt.customInitContainers" .)  . | indent 8 }}
        {{- end }}
        - name: 'copy-system-yaml'
          image: {{ include "artifactory.getImageInfoByValue" (list . "initContainers") }}
          imagePullPolicy: {{ .Values.initContainers.image.pullPolicy | quote }}
          {{- if .Values.jfmelt.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.jfmelt.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.initContainers.resources }}
          resources:
            {{- toYaml .Values.initContainers.resources | nindent 12 }}
          {{- end }}
          command:
            - '/bin/bash'
            - '-c'
            - >
              echo "Copy system.yaml to {{ .Values.jfmelt.persistence.mountPath }}/etc";
              mkdir -p {{ .Values.jfmelt.persistence.mountPath }}/etc;
              mkdir -p {{ .Values.jfmelt.persistence.mountPath }}/etc/access/keys/trusted;
              {{- if .Values.systemYamlOverride.existingSecret }}
              cp -fv /tmp/etc/{{ .Values.systemYamlOverride.dataKey }} {{ .Values.jfmelt.persistence.mountPath }}/etc/system.yaml;
              {{- else }}
              cp -fv /tmp/etc/system.yaml {{ .Values.jfmelt.persistence.mountPath }}/etc/system.yaml;
              {{- end }}

              echo "Copy certificate access-root-ca.crt to {{ .Values.jfmelt.persistence.mountPath }}/data/router/keys/trusted if needed";
              mkdir -p {{ .Values.jfmelt.persistence.mountPath }}/data/router/keys/trusted;
              cp -fv /tmp/etc/trusted/access-root-ca.crt {{ .Values.jfmelt.persistence.mountPath }}/data/router/keys/trusted/access-root-ca.crt || echo "Could not copy certificate";
              echo "Remove {{ .Values.jfmelt.persistence.mountPath }}/lost+found folder if exists";
              rm -rfv {{ .Values.jfmelt.persistence.mountPath }}/lost+found;
          {{- if or .Values.artifactory.joinKey .Values.global.joinKey .Values.artifactory.joinKeySecretName .Values.global.joinKeySecretName }}
              echo "Copy joinKey to {{ .Values.jfmelt.persistence.mountPath }}/etc/security";
              mkdir -p {{ .Values.jfmelt.persistence.mountPath }}/etc/security;
              echo -n ${ARTIFACTORY_JOIN_KEY} > {{ .Values.jfmelt.persistence.mountPath }}/etc/security/join.key;
          {{- end }}
          {{- if or .Values.artifactory.masterKey .Values.global.masterKey .Values.artifactory.masterKeySecretName .Values.global.masterKeySecretName }}
              echo "Copy masterKey to {{ .Values.jfmelt.persistence.mountPath }}/etc/security";
              mkdir -p {{ .Values.jfmelt.persistence.mountPath }}/etc/security;
              echo -n ${ARTIFACTORY_MASTER_KEY} > {{ .Values.jfmelt.persistence.mountPath }}/etc/security/master.key;
          {{- end }}
          {{- if or .Values.jfmelt.customCertificates.enabled .Values.global.customCertificates.enabled }}
{{ include "jfmelt.copyCustomCerts" . | indent 14 }}
          {{- end }}
          env:
          {{- if or .Values.artifactory.joinKey .Values.global.joinKey .Values.artifactory.joinKeySecretName .Values.global.joinKeySecretName }}
          - name: ARTIFACTORY_JOIN_KEY
            valueFrom:
              secretKeyRef:
              {{- if or (not .Values.artifactory.unifiedSecretInstallation) .Values.artifactory.joinKeySecretName .Values.global.joinKeySecretName }}
                name: {{ include "artifactory.joinKeySecretName" . }}
              {{- else }}
                name: "{{ template "artifactory.unifiedSecretPrependReleaseName" . }}-unified-secret"
              {{- end }}
                key: join-key
          {{- end }}
          {{- if or .Values.artifactory.masterKey .Values.global.masterKey .Values.artifactory.masterKeySecretName .Values.global.masterKeySecretName }}
          - name: ARTIFACTORY_MASTER_KEY
            valueFrom:
              secretKeyRef:
                {{- if or (not .Values.artifactory.unifiedSecretInstallation) .Values.artifactory.masterKeySecretName .Values.global.masterKeySecretName }}
                name: {{ include "artifactory.masterKeySecretName" . }}
                {{- else }}
                name: "{{ template "artifactory.unifiedSecretPrependReleaseName" . }}-unified-secret"
                {{- end }}
                key: master-key
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.jfmelt.persistence.mountPath | quote }}
            {{- if or (not .Values.artifactory.unifiedSecretInstallation) .Values.systemYamlOverride.existingSecret }}
            - name: systemyaml
            {{- else }}
            - name: {{ include "artifactory.unifiedCustomSecretVolumeName" . }}
            {{- end }}
              {{- if .Values.systemYamlOverride.existingSecret }}
              mountPath: "/tmp/etc/{{.Values.systemYamlOverride.dataKey }}"
              subPath: {{ .Values.systemYamlOverride.dataKey }}
              {{- else  }}
              mountPath: "/tmp/etc/system.yaml"
              subPath: "system.yaml"
              {{- end }}
            {{- if or .Values.jfmelt.customCertificates.enabled .Values.global.customCertificates.enabled }}
            - name: ca-certs
              mountPath: "/tmp/certs"
            {{- end }}
        {{- if .Values.jfmelt.waitForArtifactory }}
        - name: wait-for-artifactory
          image: {{ include "artifactory.getImageInfoByValue" (list . "initContainers") }}
          imagePullPolicy: {{ .Values.initContainers.image.pullPolicy | quote }}
          {{- if .Values.jfmelt.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.jfmelt.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.initContainers.resources }}
          resources:
            {{- toYaml .Values.initContainers.resources | nindent 12 }}
          {{- end }}
          command:
          - /bin/bash
          - -c
          - |
            echo "Waiting for Artifactory service to be ready..."
            ready=false;
            while ! $ready; do echo waiting;
              curl -k --silent --output /dev/null --max-time 3 --fail "{{ tpl (include "artifactory.jfrogUrl" .) . }}/artifactory/api/v1/system/readiness"; exit_status=$?;
              if [[ $exit_status -eq 0 ]]; then ready=true; echo "Artifactory is ready. Proceeding..."; fi; sleep 1;
            done
        {{- end }}
      containers:
        {{- if .Values.observability.enabled }}
        - name: {{ .Values.observability.name }}
          image: {{ include "artifactory.getImageInfoByValue" (list . "observability") }}
          imagePullPolicy: {{ .Values.observability.image.pullPolicy }}
          {{- if .Values.jfmelt.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.jfmelt.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.observability.lifecycle }}
          lifecycle:
{{ toYaml . | indent 12 }}
          {{- end }}
          env:
          - name: JF_SHARED_PLATFORMSERVICES_ENABLED
            value: "true"
{{- with .Values.observability.extraEnvironmentVariables }}
{{ tpl (toYaml .) $ | indent 10 }}
{{- end }}
          volumeMounts:
          - name: data
            mountPath: {{ .Values.observability.persistence.mountPath | quote }}
{{- with .Values.observability.customVolumeMounts }}
{{ tpl . $ | indent 10 }}
{{- end }}
          resources:
{{ toYaml .Values.observability.resources | indent 12 }}
          {{- if .Values.observability.startupProbe.enabled }}
          startupProbe:
{{ tpl .Values.observability.startupProbe.config . | indent 12 }}
          {{- end }}
          {{- if .Values.observability.livenessProbe.enabled }}
          livenessProbe:
{{ tpl .Values.observability.livenessProbe.config . | indent 12 }}
          {{- end }}
        {{- end }}
        - name: jfmelt
          image: {{ include "artifactory.getImageInfoByValue" (list . "jfmelt") }}
          imagePullPolicy: {{ .Values.initContainers.image.pullPolicy | quote }}
          {{- if .Values.jfmelt.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.jfmelt.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.jfmelt.customCommand }}
          command:
{{- tpl (include "jfmelt.command" .) . | indent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.jfmelt.internalRestPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.jfmelt.grpcPort }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: {{ .Values.jfmelt.persistence.mountPath | quote }}
            {{- if .Values.jfmelt.customVolumeMounts }}
{{ tpl (include "artifactory.jfmelt.customVolumeMounts" .) . | indent 12 }}
            {{- end }}
          env:
            - name: SERVICE_JSON_LOGS
              value: {{.Values.logging.logToStdoutJson | quote }}
            ## Warning: This JF_JFMELT_LISTENADDR env is for probe, you may remove this if not needed.
            - name: JF_JFMELT_LISTENADDR
              value: "0.0.0.0"
            - name: JF_SHARED_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if or .Values.artifactory.masterKey .Values.global.masterKey .Values.artifactory.masterKeySecretName .Values.global.masterKeySecretName }}
            - name: JF_SHARED_SECURITY_MASTERKEY
              valueFrom:
                secretKeyRef:
                {{- if or (not .Values.artifactory.unifiedSecretInstallation) .Values.artifactory.masterKeySecretName .Values.global.masterKeySecretName }}
                  name: {{ include "artifactory.masterKeySecretName" . }}
                {{- else }}
                  name: "{{ template "artifactory.unifiedSecretPrependReleaseName" . }}-unified-secret"
                {{- end }}
                  key: master-key
            {{- end }}
            {{- if or .Values.artifactory.joinKey .Values.global.joinKey .Values.artifactory.joinKeySecretName .Values.global.joinKeySecretName }}
            - name: JF_SHARED_SECURITY_JOINKEY
              valueFrom:
                secretKeyRef:
                {{- if or (not .Values.artifactory.unifiedSecretInstallation) .Values.artifactory.joinKeySecretName .Values.global.joinKeySecretName }}
                  name: {{ include "artifactory.joinKeySecretName" . }}
                {{- else }}
                  name: "{{ template "artifactory.unifiedSecretPrependReleaseName" . }}-unified-secret"
                {{- end }}
                  key: join-key
            {{- end }}
            {{- if .Values.jfmelt.javaOpts }}
            - name: EXTRA_JAVA_OPTS
              value: {{ .Values.jfmelt.javaOpts }}
            {{- end }}
{{- with .Values.jfmelt.extraEnvironmentVariables }}
{{ tpl (toYaml .) $ | indent 12 }}
{{- end }}
          resources: {{- toYaml .Values.jfmelt.resources | nindent 12 }}
          {{- if .Values.jfmelt.startupProbe.enabled }}
          startupProbe:
{{ tpl .Values.jfmelt.startupProbe.config . | indent 12 }}
          {{- end }}
          {{- if .Values.jfmelt.readinessProbe.enabled }}
          readinessProbe:
{{ tpl .Values.jfmelt.readinessProbe.config . | indent 12 }}
          {{- end }}
          {{- if .Values.jfmelt.livenessProbe.enabled }}
          livenessProbe:
{{ tpl .Values.jfmelt.livenessProbe.config . | indent 12 }}
          {{- end }}
          {{- with .Values.jfmelt.lifecycle }}
          lifecycle:
{{ toYaml . | indent 12 }}
          {{- end }}
        - name: router
          image: {{ include "artifactory.getImageInfoByValue" (list . "router") }}
          imagePullPolicy: {{ .Values.router.image.pullPolicy }}
          resources: {{- toYaml .Values.router.resources | nindent 12 }}
          {{- if .Values.jfmelt.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.jfmelt.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          command:
            - '/bin/bash'
            - '-c'
            - >
              exec /opt/jfrog/router/app/bin/entrypoint-router.sh
          env:
            - name: JF_SHARED_JFROGURL
              value: {{ tpl (include "jfmelt.jfrogUrl" .) . }}
            - name: JF_SHARED_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: JF_SHARED_NODE_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: JF_ROUTER_TOPOLOGY_LOCAL_REQUIREDSERVICETYPES
              value: "jfmelt"
            {{- if or .Values.artifactory.masterKey .Values.global.masterKey .Values.artifactory.masterKeySecretName .Values.global.masterKeySecretName }}
            - name: JF_SHARED_SECURITY_MASTERKEY
              valueFrom:
                secretKeyRef:
                {{- if or (not .Values.artifactory.unifiedSecretInstallation) .Values.artifactory.masterKeySecretName .Values.global.masterKeySecretName }}
                  name: {{ include "artifactory.masterKeySecretName" . }}
                {{- else }}
                  name: "{{ template "artifactory.unifiedSecretPrependReleaseName" . }}-unified-secret"
                {{- end }}
                  key: master-key
            {{- end }}
            {{- if or .Values.artifactory.joinKey .Values.global.joinKey .Values.artifactory.joinKeySecretName .Values.global.joinKeySecretName }}
            - name: JF_SHARED_SECURITY_JOINKEY
              valueFrom:
                secretKeyRef:
                {{- if or (not .Values.artifactory.unifiedSecretInstallation) .Values.artifactory.joinKeySecretName .Values.global.joinKeySecretName }}
                  name: {{ include "artifactory.joinKeySecretName" . }}
                {{- else }}
                  name: "{{ template "artifactory.unifiedSecretPrependReleaseName" . }}-unified-secret"
                {{- end }}
                  key: join-key
            {{- end }}
{{- with .Values.router.extraEnvironmentVariables }}
{{ tpl (toYaml .) $ | indent 12 }}
{{- end }}
          ports:
            - name: http-router
              containerPort: {{ .Values.router.externalPort }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.router.persistence.mountPath | quote }}
              {{- with .Values.router.customVolumeMounts }}
{{ tpl . $ | indent 12 }}
              {{- end }}
            {{- if .Values.router.startupProbe.enabled }}
          startupProbe:
{{ tpl .Values.router.startupProbe.config . | indent 12 }}
            {{- end }}
            {{- if .Values.router.readinessProbe.enabled }}
          readinessProbe: 
{{ tpl .Values.router.readinessProbe.config . | indent 12 }}
            {{- end }}
            {{- if .Values.router.livenessProbe.enabled }}
          livenessProbe: 
{{ tpl .Values.router.livenessProbe.config . | indent 12 }}
            {{- end }}
            {{- with .Values.router.lifecycle }}
          lifecycle:
{{ toYaml . | indent 12 }}
            {{- end }}
      {{- if .Values.jfmelt.customSidecarContainers }}
{{ tpl (include "artifactory.jfmelt.customSidecarContainers" .)  . | indent 8 }}
      {{- end }}
      volumes:
        # system yaml
        {{- if .Values.systemYamlOverride.existingSecret }}
        - name: systemyaml
          secret:
            secretName: {{ .Values.systemYamlOverride.existingSecret }}
        {{- end }}

        #########  unifiedSecretInstallation ###########
      {{- if and .Values.artifactory.unifiedSecretInstallation (eq (include "artifactory.jfmelt.checkDuplicateUnifiedCustomVolume" .) "false" ) }}
        - name: {{ include "artifactory.unifiedCustomSecretVolumeName" . }}
          secret:
            secretName: "{{ template "artifactory.unifiedSecretPrependReleaseName" . }}-unified-secret"
      {{- else if not .Values.artifactory.unifiedSecretInstallation }}
        {{- if not .Values.systemYamlOverride.existingSecret }}
        - name: systemyaml
          secret:
            secretName: {{ printf "%s-%s" (include "artifactory.fullname" .) "systemyaml" }}
        {{- end }}
      {{- end }}
        {{- if .Values.jfmelt.customVolumes }}
{{ tpl (include "artifactory.jfmelt.customVolumes" .)  . | indent 8 }}
        {{- end }}
        {{- if .Values.observability.customVolumes }}
{{ tpl (include "artifactory.observability.customVolumes" .)  . | indent 8 }}
        {{- end }}
        {{- if .Values.router.customVolumes }}
{{ tpl (include "artifactory.router.customVolumes" .)  . | indent 8 }}
        {{- end }}
        # jfmelt-certs secrets
        {{- if or .Values.jfmelt.customCertificates.enabled .Values.global.customCertificates.enabled }}
        - name: ca-certs
          secret:
            secretName: {{ default .Values.global.customCertificates.certificateSecretName .Values.jfmelt.customCertificates.certificateSecretName }}
        {{- end }}
        - name: data
          emptyDir: {}
      {{- with .Values.jfmelt.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.jfmelt.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.jfmelt.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
