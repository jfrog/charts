{{/*
Unified platform Secret for Wingman.

Holds every credential the chart needs to ship with the release:
  - system.yaml (under stringData; gated by systemYamlOverride.existingSecret —
    when the operator brings their own systemyaml Secret we mount that
    instead and skip the chart-rendered copy)
  - master-key and join-key (router/backend auth with the JFrog Platform)
  - db-url, db-user, db-password (operator-supplied
    .Values.database.{url,username,password}; sourced as
    JF_SHARED_DATABASE_{URL,USERNAME,PASSWORD} env vars on the deployment.
    Legacy db-username / database-password keys are dual-emitted for one
    release of backward-compat.
    .Values.database.user is accepted as a backward-compatible alias for
    .Values.database.username (preferring username when both are set).
    Bundled PG password is owned by the Bitnami subchart's own Secret.)
  - Any operator-provided extras declared under .Values.createSecret.values
    (e.g. third_party_api_token). Keys are copied verbatim; the
    wingman.secretEnvVars helper uppercases them when wiring env vars.

Naming: {{ include "wingman.unifiedSecretName" . }} → <release>-wingman-unified-secret

Rendered unconditionally: the master-key / join-key keys are independent of
how system.yaml is sourced, so the Secret is always created (even when the
operator supplies a full system.yaml via systemYamlOverride.existingSecret)
so that env-var secretKeyRefs resolve without lookup churn.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wingman.unifiedSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "wingman.labels" . | nindent 4 }}
    {{- with .Values.labels }}
{{ toYaml . | indent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
{{- if not .Values.systemYamlOverride.existingSecret }}
stringData:
  system.yaml: |
{{ include "wingman.finalSystemYaml" . | nindent 4 }}
{{- end }}
data:
  {{- $global := .Values.global | default dict }}
  {{- if or .Values.masterKey $global.masterKey }}
  {{- if not (or .Values.masterKeySecretName $global.masterKeySecretName) }}
  master-key: {{ include "wingman.masterKey" . | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if or .Values.joinKey $global.joinKey }}
  {{- if not (or .Values.joinKeySecretName $global.joinKeySecretName) }}
  join-key: {{ include "wingman.joinKey" . | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.database.url }}
  {{/* tpl: the umbrella ships database.url/user/password as template strings. */}}
  db-url: {{ tpl .Values.database.url $ | b64enc | quote }}
  {{- end }}
  {{- $dbUsername := .Values.database.username | default .Values.database.user }}
  {{- if $dbUsername }}
  {{/* db-user/db-password: umbrella key names. Legacy db-username/
       database-password dual-emitted for one release of back-compat. */}}
  db-user: {{ tpl $dbUsername $ | b64enc | quote }}
  db-username: {{ tpl $dbUsername $ | b64enc | quote }}
  {{- end }}
  {{- if .Values.database.password }}
  db-password: {{ tpl .Values.database.password $ | b64enc | quote }}
  database-password: {{ tpl .Values.database.password $ | b64enc | quote }}
  {{- end }}
  {{- range $key, $val := .Values.createSecret.values }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
