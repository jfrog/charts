artifactory:
  ##############################################################################################
  # The xsmall sizing
  # This is the minimum size recommended for running Artifactory
  # [WARNING] Some of the configuration mentioned in this file are taken inside system.yaml
  # hence this configuration will be overridden when enabling systemYamlOverride
  ##############################################################################################
  splitServicesToContainers: true
  artifactory:
    # Enterprise and above licenses are required for setting replicaCount greater than 1.
    # Count should be equal or above the total number of licenses available for artifactory.
    replicaCount: 1
  
    # Require multiple Artifactory pods to run on separate nodes
    podAntiAffinity:
      type: "hard"
  
    resources:
      requests:
        cpu: "1"
        memory: 3Gi
      limits:
        # cpu: "10"
        memory: 4Gi
  
    javaOpts:
      other: >
        -XX:InitialRAMPercentage=40
        -XX:MaxRAMPercentage=70
        -Dartifactory.async.corePoolSize=10
        -Dartifactory.async.poolMaxQueueSize=2000
        -Dartifactory.http.client.max.total.connections=20
        -Dartifactory.http.client.max.connections.per.route=20
        -Dartifactory.access.client.max.connections=15
        -Dartifactory.metadata.event.operator.threads=2
        -XX:MaxMetaspaceSize=400m
        -XX:CompressedClassSpaceSize=96m
        -Djdk.nio.maxCachedBufferSize=131072
        -XX:MaxDirectMemorySize=128m
    tomcat:
      connector:
        maxThreads: 50
        extraConfig: 'acceptCount="200" acceptorThreadCount="2" compression="off" connectionLinger="-1" connectionTimeout="120000" enableLookups="false"'
  
    database:
      maxOpenConnections: 15
  
    extraEnvironmentVariables:
      - name: MALLOC_ARENA_MAX
        value: "2"
  
  access:
    tomcat:
      connector:
        maxThreads: 15
    javaOpts:
      other: >
        -XX:InitialRAMPercentage=20
        -XX:MaxRAMPercentage=60
    database:
      maxOpenConnections: 15
    resources:
      requests:
        cpu: 500m
        memory: 1.5Gi
      limits:
        # cpu: "1"
        memory: 2Gi
    extraEnvironmentVariables:
      - name: MALLOC_ARENA_MAX
        value: "2"
  
  router:
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        # cpu: "2"
        memory: 1Gi
  
  frontend:
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 250Mi
      limits:
        # cpu: "2"
        memory: 500Mi
  
  metadata:
    database:
      maxOpenConnections: 15
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        # cpu: "2"
        memory: 1Gi
  
  event:
    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        # cpu: 500m
        memory: 250Mi
  
  onemodel:
    resources:
      requests:
        cpu: 125m
        memory: 100Mi
      limits:
        # cpu: "2"
        memory: 500Mi
  
  observability:
    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        # cpu: 500m
        memory: 250Mi
  
  jfconnect:
    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        # cpu: 500m
        memory: 250Mi
  
  jfconfig:
    resources:
      requests:
        cpu: 50m
        memory: 500Mi
      limits:
        memory: 800Mi
    extraEnvironmentVariables:
      - name: MALLOC_ARENA_MAX
        value: "2"
  
  topology:
    resources:
      requests:
        cpu: 50m
        memory: 500Mi
      limits:
        memory: 800Mi
    extraEnvironmentVariables:
      - name: MALLOC_ARENA_MAX
        value: "2"
  
  nginx:
    replicaCount: 1
    disableProxyBuffering: true
    resources:
      requests:
        cpu: "50m"
        memory: "50Mi"
      limits:
        # cpu: "1"
        memory: "250Mi"
  
  postgresql:
    primary:
      extendedConfiguration: |
        max_connections = 50
      affinity:
        # Require PostgreSQL pod to run on a different node than Artifactory pods
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - artifactory
              topologyKey: kubernetes.io/hostname
      resources:
        requests:
          memory: 8Gi
          cpu: "2"
        limits:
          memory: 8Gi
          # cpu: "8"
  
  evidence:
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
      limits:
        # cpu: "1"
        memory: 1Gi
  
  rtfs:
    replicaCount: 1
    resources:
      requests:
        cpu: 500m
        memory: 3500Mi
      limits:
        # cpu: "2"
        memory: 3500Mi
  
  jfbus:
    replicaCount: 1
    resources:
      requests:
        cpu: 500m
        memory: 3500Mi
      limits:
        # cpu: "2"
        memory: 3500Mi
  
  jfmelt:
    replicaCount: 1
    resources:
      requests:
        cpu: 500m
        memory: 500Mi
      limits:
        # cpu: "2"
        memory: 1Gi
  
  platformfederation:
    replicaCount: 1
    resources:
      requests:
        cpu: 125m
        memory: 100Mi
      limits:
        # cpu: "2"
        memory: 500Mi
  
  apptrust:
    replicaCount: 1
    resources:
      requests:
        cpu: 150m
        memory: 100Mi
      limits:
        # cpu: "2"
        memory: 300Mi
  
  unifiedpolicy:
    replicaCount: 1
    resources:
      requests:
        cpu: 150m
        memory: 100Mi
      limits:
        # cpu: "2"
        memory: 300Mi
  
  evaluation:
    replicaCount: 1
    resources:
      requests:
        cpu: 150m
        memory: 100Mi
      limits:
        # cpu: "2"
        memory: 300Mi
xray:
  ##############################################################
  # The xsmall sizing
  # This is the minimum size recommended for running JFrog Xray
  ##############################################################
  
  # For autoscaling, refer to the KEDA HPA example:
  # https://github.com/jfrog/charts/tree/master/examples/xray/xray-with-keda-hpa
  # If KEDA cannot be installed in your cluster, a static replicaCount (as set below) is recommended.
  replicaCount: 1
  databaseUpgradeReady: true
  waitForDatabase: true
  unifiedUpgradeAllowed: true
  
  xray:
    podAntiAffinity:
      ## Valid values are "soft" or "hard"; any other value indicates no anti-affinity
      type: "hard"
      topologyKey: "kubernetes.io/hostname"
  
  analysis:
    resources:
      requests:
        cpu: "30m"
        memory: 250Mi
      limits:
        # cpu: "3"
        memory: 4Gi
  
  indexer:
    resources:
      requests:
        cpu: "36m"
        memory: 800Mi
      limits:
        # cpu: "4"
        memory: 4Gi
  
  persist:
    resources:
      requests:
        cpu: "30m"
        memory: 250Mi
      limits:
        # cpu: "3"
        memory: 4Gi
  
  server:
    resources:
      requests:
        cpu: "60m"
        memory: 250Mi
      limits:
        # cpu: "3"
        memory: 4Gi
  
  router:
    resources:
      requests:
        cpu: "24m"
        memory: 50Mi
      limits:
        # cpu: "3"
        memory: 1Gi
  
  observability:
    resources:
      requests:
        cpu: "5m"
        memory: 25Mi
      limits:
        # cpu: "850m"
        memory: 250Mi
  
  sbom:
    resources:
      requests:
        cpu: "30m"
        memory: 250Mi
      limits:
        # cpu: "3"
        memory: 4Gi
  
  policyenforcer:
    resources:
      requests:
        memory: "250Mi"
        cpu: "30m"
      limits:
        memory: "4Gi"
        # cpu: "3"
  
  aiscanner:
    resources:
      requests:
        cpu: "30m"
        memory: 100Mi
      limits:
        # cpu: "2"
        memory: 4Gi
  
  curation:
    resources:
      requests:
        cpu: "180m"
        memory: 500Mi
      limits:
        # cpu: "4"
        memory: 6Gi
  
  jascontextual:
    resources:
      requests:
        cpu: "1.5"
        memory: 4Gi
      limits:
        # cpu: "3.0"
        memory: 16Gi
  
  jasexposures:
    resources:
      requests:
        cpu: "1.5"
        memory: 4Gi
      limits:
        # cpu: "3.0"
        memory: 16Gi
  
  reporting:
    resources:
      requests:
        cpu: "60m"
        memory: 250Mi
      limits:
        # cpu: "3"
        memory: 4Gi
  
  initContainers:
    resources:
      requests:
        memory: "50Mi"
        cpu: "12m"
      limits:
        memory: "1Gi"
        cpu: "250m"
  
  # PostgreSQL
  ## Configuration values for the postgresql dependency
  ## ref: https://github.com/kubernetes/charts/blob/master/stable/postgresql/README.md
  ##
  postgresql:
  
    primary:
      resources:
        requests:
          memory: 16Gi
          cpu: "6"
        limits:
          memory: 16Gi
          # cpu: "18"
      extendedConfiguration: |
        max_connections = 500
        listen_addresses = '*'
        max_wal_size = '4GB'
      affinity:
        # Require PostgreSQL pod to run on a different node than Xray pods
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - xray
              topologyKey: kubernetes.io/hostname
  
  catalog:
    resources:
      requests:
        cpu: "1"
        memory: 3Gi
      limits:
        # cpu: "2"
        memory: 6Gi
    initContainers:
      resources:
        requests:
          memory: "50Mi"
          cpu: "12m"
        limits:
          memory: "1Gi"
          cpu: "250m"
    router:
      resources:
        requests:
          cpu: "24m"
          memory: 50Mi
        limits:
          # cpu: "3"
          memory: 1Gi
  
  valkey:
    primary:
      resources:
        requests:
          cpu: "500m"
          memory: 1Gi
        limits:
          # cpu: "1"
          memory: 2Gi
      ## Bound the cache below limits.memory so Valkey evicts instead of being
      ## OOMKilled. The headroom covers fork() copy-on-write during AOF rewrite,
      ## replication buffers and allocator fragmentation.
      ## Applied when sentinel.enabled=false; keep in sync with limits.memory.
      configuration: |-
        maxmemory 1gb
        maxmemory-policy allkeys-lru
    replica:
      resources:
        requests:
          cpu: "500m"
          memory: 1Gi
        limits:
          # cpu: "1"
          memory: 2Gi
      ## With sentinel.enabled=true (the default) every node runs from this
      ## block, so this is the setting that actually takes effect.
      configuration: |-
        maxmemory 1gb
        maxmemory-policy allkeys-lru
    sentinel:
      resources:
        requests:
          cpu: "250m"
          memory: 256Mi
        limits:
          # cpu: "1"
          memory: 1Gi
    kubectl:
      resources:
        requests:
          memory: "50Mi"
          cpu: "12m"
        limits:
          memory: "250Mi"
          cpu: "250m"
rabbitmq:
  extraConfiguration: |-
    vm_memory_high_watermark.absolute = 2G
    {{- if not .Values.global.xray.rabbitmq.haQuorum.enabled }}
    raft.wal_max_size_bytes = 1048576
    {{- end }}
  resources:
    requests:
      cpu: "200m"
      memory: 300Mi
    limits:
      # cpu: "2"
      memory: 3Gi

distribution:
  ##############################################################
  # The xsmall sizing
  # This is the minimum size recommended for running Distribution
  ##############################################################
  
  unifiedUpgradeAllowed: true
  databaseUpgradeReady: true
  
  replicaCount: 1
  
  distribution:
    resources:
      requests:
        cpu: 50m
        memory: 700Mi
      limits:
        # cpu: "3"
        memory: 1200Mi
  
    extraEnvironmentVariables:
      - name: MALLOC_ARENA_MAX
        value: "2"
  
    javaOpts:
      other: >
        -XX:InitialRAMPercentage=30
        -XX:MaxRAMPercentage=60
        -XX:+UseStringDeduplication
        -XX:MaxMetaspaceSize=300m
        -Djdk.nio.maxCachedBufferSize=262144
        -XX:MaxDirectMemorySize=256m
  
  router:
    resources:
      requests:
        cpu: 30m
        memory: 100Mi
      limits:
        # cpu: "1"
        memory: 1Gi
  
  observability:
    resources:
      requests:
        cpu: 20m
        memory: 20Mi
      limits:
        # cpu: "1"
        memory: 50Mi
  
  postgresql:
    primary:
      extendedConfiguration: |
        max_connections = 50
      affinity:
        # Require PostgreSQL pod to run on a different node than distribution pods
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - distribution
              topologyKey: kubernetes.io/hostname
      resources:
        requests:
          cpu: "20m"
          memory: 200Mi
        limits:
          # cpu: "2"
          memory: 1Gi

