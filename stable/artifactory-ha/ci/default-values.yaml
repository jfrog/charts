# Leave this file empty to ensure that CI runs builds against the default configuration in values.yaml.
databaseUpgradeReady: true
## This is an exception here because HA needs masterKey to connect with other nodes and it is commented in values to support 6.x to 7.x Migration
## Please refer https://github.com/jfrog/charts/blob/master/stable/artifactory-ha/README.md#special-upgrade-notes-1
artifactory:
  masterKey: FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF
  joinKey: EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
  persistence:
    enabled: false
  primary:
    resources:
      requests:
        memory: "4Gi"
        cpu: "2"
      limits:
        memory: "6Gi"
        cpu: "4"
    javaOpts:
      xms: "4g"
      xmx: "4g"

## Generate a self-signed TLS certificate for nginx HTTPS. Opt-in, default off.
## DEV/TEST ONLY. The generated private key is created inside the cluster and
## is not issued by a trusted CA. In production, provide a real certificate
## via nginx.tlsSecretName instead.
## Ignored when nginx.tlsSecretName is set or nginx.https.enabled is false.
nginx:
  generateSelfSignedCert: true
# To Fix ct tool --reuse-values - PASSWORDS ERROR: you must provide your current passwords when upgrade the release
postgresql:
  auth:
    password: "password"
  primary:
    persistence:
      enabled: false
